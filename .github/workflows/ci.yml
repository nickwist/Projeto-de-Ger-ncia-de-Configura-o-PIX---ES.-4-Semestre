name: CI

# Roda em todo PR para dev/main e em push nessas branches e nas feat-*
on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main, "feat-*", "feat/**", "fix-*"]

jobs:
  testes:
    name: Compilar e testar
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4

      - name: Instalar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Compilar e rodar os testes
        run: ./projeto.sh testar

      - name: Guardar relatorio dos testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-testes
          path: relatorio-testes/

  docker:
    name: Build da imagem Docker
    runs-on: ubuntu-latest
    needs: testes
    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4

      - name: Construir a imagem
        run: docker build -t api-pix .